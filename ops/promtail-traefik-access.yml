# Added to promtail on all five nodes (container mount: /home/hieudc/traefik/logs:/traefik-logs:ro).
# Lines older than 15 minutes are dropped so a promtail restart (positions lost) never replays history into Loki.
scrape_configs:
  - job_name: traefik-access
    static_configs:
      - targets: [localhost]
        labels: { job: traefik-access, host: <node>, __path__: /traefik-logs/access.log }
    pipeline_stages:
      # CLF nodes; the JSON nodes (oracle, loadbalancer) use '"time":"(?P<ts>[^"]+)"' with format RFC3339.
      - regex: { expression: '\[(?P<ts>\d{2}/\w{3}/\d{4}:\d{2}:\d{2}:\d{2} [+-]\d{4})\]' }
      - timestamp: { source: ts, format: '02/Jan/2006:15:04:05 -0700' }
      - drop: { older_than: 15m, drop_counter_reason: traefik_access_old_line }
