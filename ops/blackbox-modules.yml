# Added to the blackbox exporter modules (server-3 ~/monitoring/blackbox/). No redirect following: a redirect to a
# login page already proves the app answered.
modules:
  app_ok:
    prober: http
    timeout: 10s
    http: { valid_status_codes: [200, 301, 302, 303, 307, 308], follow_redirects: false, preferred_ip_protocol: ip4 }
  # Admin tools behind basicAuth/OIDC (Jenkins answers 403 to anonymous users).
  app_gated:
    prober: http
    timeout: 10s
    http: { valid_status_codes: [200, 301, 302, 303, 307, 308, 401, 403], follow_redirects: false, preferred_ip_protocol: ip4 }
  # Tailnet-only apps: 403 there is Traefik refusing the source, not the app answering.
  app_tailnet:
    prober: http
    timeout: 10s
    http: { valid_status_codes: [200, 301, 302, 303, 307, 308, 401], follow_redirects: false, preferred_ip_protocol: ip4 }
