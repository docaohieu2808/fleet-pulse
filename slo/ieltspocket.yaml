version: "prometheus/v1"
service: "ieltspocket"
labels:
  app: "ieltspocket"
  host: "external"
slos:
  # Black-box only: nothing runs on the host. Each failed probe is a failed event.
  - name: "availability"
    objective: 99.5
    description: "99.5% of external probes to ieltspocket succeed over 30 days."
    sli:
      events:
        error_query: (sum(count_over_time(probe_success{job="blackbox-http",app="ieltspocket"}[{{.window}}])) - sum(sum_over_time(probe_success{job="blackbox-http",app="ieltspocket"}[{{.window}}])))
        total_query: sum(count_over_time(probe_success{job="blackbox-http",app="ieltspocket"}[{{.window}}]))
    alerting:
      name: SLOIeltspocketAvailability
      labels:
        category: slo
      annotations:
        summary: "ieltspocket: error budget is burning too fast"
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning
